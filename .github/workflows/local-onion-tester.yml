## AI-Assisted

## Probe Tor onion time sources + verify removed/added deltas
## against the diff base. local-* prefix per G-A-005 (sdwdate-
## specific; no cross-repo reuse).
##
## The onion-tester WRAPPER scripts (onion-tester-run, -warmup,
## -newnym, -configure-tor, -wait-bootstrap, -probe-removed,
## -verify-evidence) live in org-ai-assisted/dist-ai, not here;
## this workflow checks them out (dist-ai@master, step below) and
## runs them against a real Tor. Two consequences of that split:
##   * A change to those wrappers CANNOT trigger this workflow --
##     the paths: filter below can only watch sdwdate's own files.
##     Their offline regression suite runs in dist-ai's own
##     local-onion-tester-tests.yml self-test lane instead; the
##     REAL-Tor check here re-validates them on the next sdwdate
##     PR or via workflow_dispatch.
##   * paths: therefore lists only the sdwdate-side inputs (the
##     probe, the conf, the sdwdate python lib); the wrappers are
##     deliberately absent because they are not in this repo.

name: onion-tester

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'etc/sdwdate.d/**'
      - 'usr/share/sdwdate/onion-tester'
      - 'usr/lib/python3/dist-packages/sdwdate/**'
      - 'usr/bin/url_to_unixtime'
      - '.github/workflows/local-onion-tester.yml'
  pull_request:
    paths:
      - 'etc/sdwdate.d/**'
      - 'usr/share/sdwdate/onion-tester'
      - 'usr/lib/python3/dist-packages/sdwdate/**'
      - 'usr/bin/url_to_unixtime'
      - '.github/workflows/local-onion-tester.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    ## CI runs only where we enabled it. Unset variable -> the job is
    ## skipped, no runner is allocated, and the run stays green: upstream
    ## and forks are never handed a red X for a lane they did not opt into.
    ## A fork that WANTS our CI sets the same variable in its own repo.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    ## Backstop only. The per-step caps below are the real budgets; this has
    ## to exceed their sum or a slow-but-healthy Tor run gets cut off with no
    ## verdict and no summary.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ## Public repo + only local git operations after checkout, so
          ## don't leave GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - name: Install apt deps + genmkfile + helper-scripts + sdwdate
        uses: org-ai-assisted/developer-meta-files/.github/actions/install-deps@master
        with:
          ## sdwdate runtime deps (debian/control) + curl/ca-cert
          ## for the probe scripts + safe-rm for genmkfile.
          apt-packages: 'tor python3-dateutil python3-stem python3-requests python3-socks python3-sdnotify curl ca-certificates safe-rm'
          install-self: 'true'

      - name: Checkout dist-ai (onion-tester ci scripts + step-summary-emit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          ref: master
          path: .github/dist-ai
          persist-credentials: false

      - name: Configure and start Tor
        run: ./.github/dist-ai/usr/bin/onion-tester-configure-tor

      - name: Wait for Tor bootstrap
        run: ./.github/dist-ai/usr/bin/onion-tester-wait-bootstrap

      - name: Run onion-tester (Tor SOCKS5 probe, retry on transient flake)
        id: onion-tester
        ## Attempt 1 probes the full conf (measured 5-13 min); later attempts
        ## re-probe ONLY the URLs that failed, so a transient per-onion flake is
        ## cheap. Each retry is preceded by NEWNYM plus a 60s settle, so a full
        ## 3-attempt run is a full sweep + 2 short retries + 2 sleeps. The wrapper
        ## self-bounds to a 20-min wall-clock deadline (ONION_TESTER_DEADLINE) and
        ## runs each attempt under `timeout`, so it exits cleanly + records outputs;
        ## this step cap is the backstop above that (24 > 20).
        timeout-minutes: 24
        run: ./.github/dist-ai/usr/bin/onion-tester-run

      - name: Probe REMOVED onion entries (must be OFFLINE)
        id: probe-removed
        if: always()
        ## At most a handful of removed onions per PR; each is one
        ## curl with --max-time 60. 5 minutes covers a dozen probes.
        timeout-minutes: 5
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: ./.github/dist-ai/usr/bin/onion-tester-probe-removed

      - name: Verify wayback evidence for ADDED entries (proof onion <-> clearnet)
        id: verify-evidence
        if: always()
        ## Per entry: 3 archive URL tiers x 4 retries x ~90s curl =
        ## up to ~18 min for a single fully-failing entry. Cap the
        ## step so a pathological set can't blow the job budget.
        timeout-minutes: 20
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: ./.github/dist-ai/usr/bin/onion-tester-verify-evidence

      - name: Summary - onion-tester
        if: always()
        env:
          JOB_STATUS: ${{ steps.onion-tester.outcome }}
          ATTEMPTS: ${{ steps.onion-tester.outputs.attempts }}
          FINAL_RC: ${{ steps.onion-tester.outputs.final_rc }}
          FINAL_RC_LEGEND: ${{ steps.onion-tester.outputs.final_rc_legend }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'onion-tester (Tor SOCKS5 probe of every URL in the conf)' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "attempts=${ATTEMPTS:-?}" \
            --row "final-rc=${FINAL_RC:-?} ${FINAL_RC_LEGEND:-(legend unavailable)}"

      - name: Summary - probe-removed
        if: always()
        env:
          JOB_STATUS: ${{ steps.probe-removed.outcome }}
          REMOVED: ${{ steps.probe-removed.outputs.removed_count }}
          ALIVE: ${{ steps.probe-removed.outputs.still_alive }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'probe-removed (truly-dropped onions must be unreachable)' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "removed-checked=${REMOVED:-0}" \
            --row "still-alive=${ALIVE:-0}"

      - name: Summary - verify-evidence
        if: always()
        env:
          JOB_STATUS: ${{ steps.verify-evidence.outcome }}
          ADDED: ${{ steps.verify-evidence.outputs.added_count }}
          VERIFIED: ${{ steps.verify-evidence.outputs.verified }}
          MISSING: ${{ steps.verify-evidence.outputs.missing }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'verify-evidence (wayback URL must mention the .onion hash)' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "added-checked=${ADDED:-0}" \
            --row "verified=${VERIFIED:-0}" \
            --row "missing=${MISSING:-0}"

      - name: Tail Tor log on failure
        if: failure()
        run: sudo tail --lines=100 /var/log/tor/notice.log || true
